<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" style="max-width: 300px; display: block; margin: auto;">
  <defs>
    <style>
      .bg-circle {
        fill: none;
        stroke: #4CAF50;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: draw 0.6s ease forwards;
      }
      
      .check-mark {
        fill: none;
        stroke: #4CAF50;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw 0.4s 0.6s ease forwards;
      }
      
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
      
      .confetti-group {
        opacity: 0;
        transform-origin: 100px 95px;
        animation: popOut 0.6s 0.9s cubic-bezier(0.15, 0.85, 0.35, 1.2) forwards;
      }
      
      @keyframes popOut {
        0% { transform: scale(0.2); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: scale(1.1); opacity: 1; }
      }
      
      .text-anim {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 20px;
        font-weight: bold;
        fill: #333;
        opacity: 0;
        animation: fadeUp 0.5s 1.4s ease forwards;
      }
      
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Confetti Burst -->
  <g class="confetti-group">
    <!-- Top -->
    <circle cx="100" cy="20" r="4.5" fill="#FFC107" />
    <rect x="75" y="25" width="5" height="12" fill="#FF5252" transform="rotate(25 75 25)" />
    <circle cx="125" cy="28" r="5.5" fill="#448AFF" />
    
    <!-- Right -->
    <polygon points="165,60 172,72 158,72" fill="#00E676" transform="rotate(15 165 65)" />
    <circle cx="178" cy="95" r="4.5" fill="#E040FB" />
    <rect x="165" y="125" width="5" height="12" fill="#FFC107" transform="rotate(45 165 125)" />
    
    <!-- Bottom -->
    <circle cx="130" cy="165" r="5.5" fill="#FF5252" />
    <polygon points="100,175 106,186 94,186" fill="#448AFF" />
    <circle cx="70" cy="160" r="4" fill="#00E676" />
    
    <!-- Left -->
    <rect x="30" y="125" width="5" height="12" fill="#E040FB" transform="rotate(-30 30 125)" />
    <circle cx="20" cy="95" r="5" fill="#FFC107" />
    <polygon points="35,60 42,72 28,72" fill="#FF5252" transform="rotate(-15 35 65)" />
  </g>

  <!-- Main Success Icon -->
  <g transform="translate(50, 45)">
    <circle class="bg-circle" cx="50" cy="50" r="40" />
    <path class="check-mark" d="M30 52 L44 66 L72 36" />
  </g>

  <!-- Animated Text -->
  <text x="100" y="190" class="text-anim" text-anchor="middle">Lesson Complete!</text>
</svg>