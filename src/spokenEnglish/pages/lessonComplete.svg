<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" style="max-width: 500px; display: block; margin: auto;">
  <defs>
    <!-- Dark Premium Background -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="75%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Soft Glowing Aura -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Gradient for Subtitle -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Subtle Glow Filter for Sparkles -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Central Badge Group -->
  <g transform="translate(200, 180)">
    
    <!-- Pulsing Ambient Glow -->
    <circle cx="0" cy="0" r="100" fill="url(#goldGlow)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Outer Solid Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="565" stroke-dashoffset="565">
      <animate attributeName="stroke-dashoffset" from="565" to="0" dur="1.2s" fill="freeze" />
    </circle>

    <!-- Outer Dashed Ring -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="4 12" opacity="0.6" stroke-dashoffset="565">
      <animate attributeName="stroke-dashoffset" from="565" to="0" dur="1.2s" begin="0.3s" fill="freeze" />
    </circle>

    <!-- Inner Thick Ring (Depth Effect) -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.15" stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" from="400" to="0" dur="1s" begin="0.5s" fill="freeze" />
    </circle>

    <!-- Elegant Checkmark -->
    <path d="M -30 10 L -10 30 L 35 -25" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.8s" begin="0.8s" fill="freeze" />
    </path>
  </g>

  <!-- Decorative Corner Sparkles -->
  <g>
    <!-- Top Left -->
    <path d="M 130 110 L 142 122 L 130 134 L 118 122 Z" fill="url(#gold)" filter="url(#glowFilter)">
      <animateTransform attributeName="transform" type="rotate" from="0 130 122" to="360 130 122" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.2s" repeatCount="indefinite" />
    </path>
    <!-- Top Right -->
    <path d="M 270 110 L 282 122 L 270 134 L 258 122 Z" fill="url(#gold)" filter="url(#glowFilter)">
      <animateTransform attributeName="transform" type="rotate" from="45 270 122" to="405 270 122" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.5s" repeatCount="indefinite" />
    </path>
    <!-- Bottom Left -->
    <path d="M 135 250 L 147 262 L 135 274 L 123 262 Z" fill="url(#gold)" filter="url(#glowFilter)">
      <animateTransform attributeName="transform" type="rotate" from="90 135 262" to="450 135 262" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="1.8s" repeatCount="indefinite" />
    </path>
    <!-- Bottom Right -->
    <path d="M 265 250 L 277 262 L 265 274 L 253 262 Z" fill="url(#gold)" filter="url(#glowFilter)">
      <animateTransform attributeName="transform" type="rotate" from="135 265 262" to="495 265 262" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="2.1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Decorative Divider Line -->
  <line x1="130" y1="305" x2="270" y2="305" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="100" stroke-dashoffset="100" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.6s" begin="1.2s" fill="freeze" />
  </line>

  <!-- Main Title: Lesson Complete -->
  <text x="200" y="340" font-family="'Georgia', 'Times New Roman', serif" font-size="22" font-weight="700" fill="url(#gold)" text-anchor="middle" letter-spacing="8" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.5s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0 15; 0 0" dur="0.8s" begin="1.5s" fill="freeze" />
    LESSON COMPLETE
  </text>

  <!-- Subtitle: Continue Your Path -->
  <text x="200" y="365" font-family="'Arial', 'Helvetica', sans-serif" font-size="11" font-weight="600" fill="url(#textGradient)" text-anchor="middle" letter-spacing="4" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.8s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0 15; 0 0" dur="0.8s" begin="1.8s" fill="freeze" />
    CONTINUE YOUR PATH
  </text>
</svg>